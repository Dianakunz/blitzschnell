<style>
:root{
  --bg:#f4f5f8;--card:#ffffff;--card2:#eceef3;--text:#1b1f2a;--muted:#5d6475;--line:#d9dce4;
  --accent:#e0a100;--accentText:#7a5600;--accentBg:#fff4d1;--link:#2563c9;--warn:#b54708;--warnBg:#fff1e6;
  --nav:#ffffff;
}
[data-theme="dark"]{
  --bg:#15181f;--card:#1f232d;--card2:#282d39;--text:#eceef3;--muted:#a3aabb;--line:#343a48;
  --accent:#ffc21a;--accentText:#ffd666;--accentBg:#3a3220;--link:#7fb0ff;--warn:#ffb074;--warnBg:#3a2a1e;
  --nav:#1b1f28;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
a{color:var(--link)}
.wrap{max-width:640px;margin:0 auto;padding:0 14px 96px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 14px 8px;max-width:640px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:10px}
.topbar .logo{width:34px;height:34px;display:flex}.logo svg{width:100%;height:100%}
.topbar h1{font-size:20px;margin:0;flex:1;font-weight:600}
.iconbtn{background:none;border:0;padding:6px;border-radius:8px;cursor:pointer;display:flex}
.iconbtn svg{width:24px;height:24px}
.search{margin-top:8px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 10px}
.search input{flex:1;border:0;background:none;color:var(--text);font:inherit;padding:10px 0;outline:none}
.search svg{width:18px;height:18px;color:var(--muted)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--nav);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;max-width:640px;width:100%}
nav button{flex:1;background:none;border:0;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);cursor:pointer}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--text)}
nav button.on svg{color:var(--accent)}
h2{font-size:19px;margin:18px 0 8px}
h3{font-size:16px;margin:16px 0 6px}
.muted{color:var(--muted)}
.small{font-size:14px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:left;width:100%}
.item .ic{width:38px;height:38px;border-radius:50%;background:var(--accentBg);color:var(--accentText);display:flex;align-items:center;justify-content:center;flex:none}
.item .ic svg{width:20px;height:20px}
.item .t{font-weight:600}
.item .s{font-size:13.5px;color:var(--muted)}
.item .grow{flex:1;min-width:0}
.item.soon{opacity:.55;cursor:default}
.badge{font-size:11.5px;background:var(--card2);color:var(--muted);border-radius:6px;padding:2px 7px;white-space:nowrap}
.calc input[type=range]{padding:0;border:0;background:none;accent-color:var(--accent);height:28px}
.sw-scene{width:100%;max-width:calc(36vh * 1.6);margin:0 auto;border-radius:12px;display:block;overflow:hidden;outline:1px solid var(--line)}
.sw-val{float:right;font-weight:600}
.sw-meter{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:2px}
.sw-bar{position:relative;height:8px;border-radius:4px;background:linear-gradient(90deg,#3b4256,#8a90a2 50%,#f4eccf);margin-top:8px}
.sw-bar i{position:absolute;top:-4px;width:4px;height:16px;border-radius:2px;background:var(--accent);transform:translateX(-2px)}
.sw-res div{margin:3px 0}
.ic-in svg{width:17px;height:17px;vertical-align:-3px}
.sk-bar{width:100%;height:34px;display:block;border-radius:8px;overflow:hidden}
.sk-ax{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:2px}
.sk-leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:8px}
.sk-leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.sk-t{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14.5px;margin-top:6px}
.sk-t b{font-variant-numeric:tabular-nums;white-space:nowrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer}
.chip.on{background:var(--accentBg);border-color:var(--accent);color:var(--accentText)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}
.head{display:flex;align-items:center;gap:12px}
.head .ic{width:46px;height:46px;border-radius:50%;background:var(--accentBg);color:var(--accentText);display:flex;align-items:center;justify-content:center;flex:none}
.head .ic svg{width:24px;height:24px}
.head .crumb{font-size:13px;color:var(--muted)}
.head .title{font-size:22px;font-weight:600;line-height:1.2}
.star{background:none;border:0;cursor:pointer;padding:6px;color:var(--muted)}
.star svg{width:26px;height:26px}
.star.on{color:var(--accent)}
.star.on svg{fill:var(--accent)}
.intro{color:var(--muted);margin:10px 0 0}
.seg{display:flex;gap:8px;margin-top:14px}
.seg button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px;cursor:pointer;font-size:14.5px}
.seg button.on{background:var(--accentBg);border-color:var(--accent);color:var(--accentText);font-weight:600}
.sec h3{display:flex;align-items:center;gap:8px}
.sec h3 svg{width:18px;height:18px;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cell{background:var(--card2);border-radius:10px;padding:8px 10px}
.cell .l{font-size:12.5px;color:var(--muted)}
.cell .v{font-weight:600;font-size:15px}
.cell.changed{outline:2px solid var(--accent)}
.lk{color:var(--link);text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
ul{margin:4px 0;padding-left:20px}
li{margin:3px 0}
.box{background:var(--card2);border-radius:12px;padding:10px 12px;margin-top:14px}
.box summary{cursor:pointer;font-weight:600;display:flex;align-items:center;gap:8px;list-style:none}
.box summary::-webkit-details-marker{display:none}
.box summary svg{width:18px;height:18px}
.box summary .chev{margin-left:auto;transition:transform .2s}
.box[open] summary .chev{transform:rotate(180deg)}
.try{border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:14px}
.try b{display:flex;align-items:center;gap:8px}
.try li b{display:inline}
.sw-stick{position:sticky;top:0;z-index:5;background:var(--card);padding-top:10px}
.try svg{width:18px;height:18px;color:var(--accent)}
.warnbox{background:var(--warnBg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:14.5px;margin-top:10px}
textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:10px;background:var(--card2);color:var(--text);font:inherit;padding:8px}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;cursor:pointer;color:var(--link);padding:10px 0 0;font-size:15px}
.back svg{width:18px;height:18px}
.rule{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px}
.rule .t{font-weight:600}
.rule .r{background:var(--accentBg);color:var(--accentText);border-radius:8px;padding:6px 10px;margin:6px 0;font-weight:600}
.calc label{display:block;font-size:14px;color:var(--muted);margin-top:10px}
.calc input,.calc select,.opt select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card2);color:var(--text);font:inherit}
.result{font-size:22px;font-weight:700;margin-top:12px}
.opt{margin-top:14px}
.opt .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1b1f2a;font-weight:600}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.gl dt{font-weight:600;margin-top:12px}
.gl dd{margin:2px 0 0}
.letter{font-size:13px;color:var(--muted);margin-top:16px;border-bottom:1px solid var(--line)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center;overscroll-behavior:contain}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:90vh;max-height:90dvh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-radius:18px 18px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
@media (min-width:700px){.overlay{align-items:center;padding:24px}.sheet{border-radius:18px;max-height:85vh}}
body.noscroll{overflow:hidden}
.sheet .sh{display:flex;align-items:center;position:sticky;top:-16px;background:var(--bg);margin:-16px -16px 0;padding:12px 16px;z-index:1;border-bottom:1px solid var(--line)}
.sheet .sh h2{flex:1;margin:0}
.welcome{position:fixed;inset:0;background:#1d2230;color:#f2f2f2;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.welcome .logo{width:132px;height:132px;display:block}
.welcome h1{font-size:34px;margin:20px 0 6px}
.welcome p{margin:2px 0;color:#c9cdd8;font-size:17px}
.welcome .btn{margin-top:30px;font-size:17px;padding:12px 28px}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:10px;z-index:40;font-size:14.5px}
.mark{background:var(--accentBg);color:var(--accentText);border-radius:3px}
</style>
</head>

    errors:["Verwackelt → Zeit zu lang für die Brennweite.","Gelber Farbstich durch Lampen → Weißabgleich anpassen oder in RAW korrigieren.","Stürzende Linien durch schräg gehaltene Kamera."],
    sony:["Belichtungsreihe: [Bildfolgemodus] → [Serienreihe] (z. B. 3 Bilder, je 1 Stufe Unterschied)."],

/* ---------- Grundlagen ---------- */
const GRUND = [
  {id:"zeit",title:"Belichtungszeit",short:"Wie lange Licht auf den Sensor fällt",
   text:["Die Belichtungszeit (auch Verschlusszeit) gibt an, wie lange der Verschluss offen ist. Angegeben wird sie in Sekunden oder Bruchteilen davon, z. B. 1/250 s.",
         "Kurze Zeiten frieren Bewegung ein, lange Zeiten lassen Bewegtes verwischen – das kann gewollt sein (Wasser, Lichtspuren) oder stören (verwackelte Fotos).",
         "Aus der Hand gilt grob: nicht länger als der Kehrwert der Brennweite, sonst droht Verwacklung."],
   merk:"Kurz = eingefroren, lang = verwischt. Halbe Zeit = halb so viel Licht.",see:[["spiel","","Belichtungs-Spielwiese"],["regel","kehrwert","Kehrwert der Brennweite"],["regel","bewegung","Bewegung einfrieren"]]},
  {id:"blende",title:"Blende",short:"Wie weit das Objektiv geöffnet ist",
   text:["Die Blende ist eine verstellbare Öffnung im Objektiv. Sie wird als Blendenzahl angegeben, z. B. f/2.8 oder f/8.",
         "Verwirrend, aber wichtig: Eine kleine Zahl bedeutet eine große Öffnung (viel Licht, wenig Schärfentiefe). Eine große Zahl bedeutet eine kleine Öffnung (wenig Licht, viel Schärfentiefe).",
         "„Offene Blende“ heißt die kleinste Zahl, die dein Objektiv kann, z. B. f/1.8 beim 35-mm-Objektiv. Bei Zoomobjektiven hängt sie oft von der Brennweite ab (z. B. f/3.5–6.3)."],
   merk:"Kleine Zahl = viel Licht und unscharfer Hintergrund. Große Zahl = alles scharf.",see:[["spiel","","Belichtungs-Spielwiese"],["grund","schaerfe","Schärfentiefe"],["regel","stufen","Lichtstufen"]]},
  {id:"iso",title:"ISO",short:"Wie stark das Bildsignal verstärkt wird",
   text:["Die ISO-Zahl legt fest, wie stark die Kamera das Signal des Sensors verstärkt. Doppelte ISO bedeutet: Man braucht nur halb so viel Licht.",
         "Der Preis dafür ist Bildrauschen – je höher die ISO, desto körniger und farbloser wird das Bild. Moderne Kameras liefern aber oft bis ISO 3200 oder 6400 gut brauchbare Fotos.",
         "Ein leicht verrauschtes, aber scharfes Foto ist fast immer besser als ein verwackeltes."],
   merk:"So niedrig wie möglich, so hoch wie nötig.",see:[["spiel","","Belichtungs-Spielwiese"],["grund","dreieck","Zusammenspiel"]]},
  {id:"dreieck",title:"Zusammenspiel: Zeit, Blende, ISO",short:"Das Belichtungsdreieck",
   text:["Belichtungszeit, Blende und ISO bestimmen zusammen, wie hell ein Foto wird. Ändert man einen Wert, muss man einen anderen ausgleichen, damit die Helligkeit gleich bleibt.",
         "Beispiel: Für einen fliegenden Vogel brauchst du eine kürzere Zeit (1/2000 statt 1/500 s = zwei Stufen weniger Licht). Das gleichst du mit offenerer Blende oder höherer ISO aus.",
         "Jeder Wert hat eine Nebenwirkung: Zeit → Bewegung, Blende → Schärfentiefe, ISO → Rauschen. Überleg dir, was beim Motiv am wichtigsten ist, und lege diesen Wert zuerst fest."],
   merk:"Erst den wichtigsten Wert festlegen, die anderen ausgleichen lassen.",see:[["spiel","","Belichtungs-Spielwiese"],["regel","stufen","Lichtstufen"],["grund","modus","Belichtungsprogramme"]]},
  {id:"modus",title:"Belichtungsprogramme",short:"Auto, P, A, S und M",
   text:["Auto: Die Kamera entscheidet alles. Bequem, aber du hast keinen Einfluss.",
         "P (Programmautomatik): Die Kamera wählt Zeit und Blende, du kannst ISO, Belichtungskorrektur usw. einstellen.",
         "A (Blendenpriorität, bei anderen Herstellern Av): Du wählst die Blende, die Kamera die Zeit. Gut, wenn die Schärfentiefe wichtig ist (Porträt, Landschaft).",
         "S (Zeitpriorität, bei anderen Herstellern Tv): Du wählst die Zeit, die Kamera die Blende. Gut, wenn Bewegung wichtig ist (Tiere, Sport). Anfängerfreundlich.",
         "M (Manuell): Du wählst Zeit und Blende selbst. Mit ISO-Auto gleicht die Kamera die Helligkeit über die ISO aus – so hast du volle Kontrolle und trotzdem eine automatische Belichtung. Ohne ISO-Auto bestimmst du alles selbst, z. B. bei Sternen oder dem Mond."],
   merk:"Bewegung wichtig → S. Schärfentiefe wichtig → A. Beides wichtig → M + ISO-Auto.",see:[["spiel","","Belichtungs-Spielwiese"],["grund","korrektur","Belichtungskorrektur"],["kamera","isoauto","ISO-Auto mit Mindestzeit"]]},
  {id:"korrektur",title:"Belichtungskorrektur und Histogramm",short:"Wenn die Kamera sich verschätzt",
   text:["Die Belichtungsmessung der Kamera geht davon aus, dass ein Motiv im Durchschnitt mittelgrau ist. Bei sehr hellen Motiven (Schnee, heller Himmel) wird das Foto deshalb zu dunkel, bei sehr dunklen Motiven zu hell.",
         "Mit der Belichtungskorrektur (+/−) sagst du der Kamera: „Mach es heller“ bzw. „dunkler“. Sie funktioniert in P, A und S, bei vielen Kameras (z. B. Sony) auch in M mit ISO-Auto.",
         "Das Histogramm zeigt die Helligkeitsverteilung: links dunkel, rechts hell. Stößt der Berg rechts an den Rand, sind helle Stellen ausgefressen – die sind auch per Bearbeitung nicht mehr zu retten."],
   merk:"Helles Motiv → plus. Dunkles Motiv → minus.",see:[["regel","korr","Korrigieren bei Hell und Dunkel"],["kamera","zebra","Zebra"]]},
  {id:"fokus",title:"Fokus und Autofokus",short:"AF-S, AF-C, MF und Fokusfelder",
   text:["AF-S (Einzelbild-AF): Die Kamera stellt einmal scharf, wenn du den Auslöser halb drückst, und hält diese Entfernung. Gut für Unbewegtes.",
         "AF-C (Nachführ-AF): Die Kamera stellt laufend nach, solange du den Auslöser halb drückst. Für alles, was sich bewegt.",
         "MF (manuell): Du drehst selbst am Fokusring. Hilfen dafür sind Fokuslupe und Fokus-Peaking. Gut bei Sternen, Makro oder wenn der Autofokus durch Zweige abgelenkt wird.",
         "Das Fokusfeld legt fest, wo im Bild die Kamera scharfstellt: Breit (Kamera sucht selbst), Zone (ein gewählter Bereich, bei Sony „Feld“), Spot (ein kleiner Punkt, bei Sony „Flexible Spot“) oder Tracking (das Motiv wird verfolgt). Augen-AF stellt gezielt auf Augen scharf."],
   merk:"Steht still → AF-S. Bewegt sich → AF-C. Autofokus versagt → MF.",see:[["kamera","augenaf","Augen-AF"],["kamera","peaking","Fokus-Peaking und Fokuslupe"]]},
  {id:"schaerfe",title:"Schärfentiefe",short:"Wie viel vor und hinter dem Motiv scharf ist",
   text:["Scharf ist immer nur eine Ebene. Davor und dahinter gibt es einen Bereich, der noch scharf wirkt – die Schärfentiefe.",
         "Wenig Schärfentiefe (unscharfer Hintergrund) bekommst du mit: offener Blende, langer Brennweite, geringem Abstand zum Motiv und viel Abstand zwischen Motiv und Hintergrund.",
         "Viel Schärfentiefe (alles scharf, z. B. Landschaft) bekommst du mit: geschlossener Blende (f/8–11), kurzer Brennweite und größerem Abstand."],
   merk:"Hintergrund unscharf: Blende auf, nah ran, Hintergrund weit weg.",see:[["grund","blende","Blende"],["rechner","schaerfe","Rechner: Schärfentiefe"]]},
  {id:"brennweite",title:"Brennweite und Crop-Faktor",short:"Wie groß das Motiv abgebildet wird",
   text:["Die Brennweite in Millimetern bestimmt den Bildausschnitt: Kurze Brennweiten (Weitwinkel) zeigen viel, lange Brennweiten (Tele) holen Entferntes heran.",
         "Der Sensor einer APS-C-Kamera ist kleiner als Kleinbild/Vollformat. Dadurch wirkt der Bildausschnitt enger, ungefähr wie die 1,5-fache Brennweite (bei Canon APS-C 1,6-fach): 300 mm an APS-C wirken wie 450 mm an Vollformat. Bei Micro Four Thirds ist der Faktor 2.",
         "Für Faustregeln wie den Kehrwert der Brennweite rechnet man mit der umgerechneten Brennweite. Die Sensorgröße kannst du in den Optionen einstellen."],
   merk:"APS-C: Brennweite × 1,5 (Canon × 1,6). MFT: × 2.",see:[["regel","kehrwert","Kehrwert der Brennweite"]]},
  {id:"wb",title:"Weißabgleich",short:"Damit Weiß auch weiß aussieht",
   text:["Licht hat je nach Quelle eine andere Farbe: Glühlampe und Sonnenuntergang sind warm-orange, Schatten und bedeckter Himmel eher bläulich. Der Weißabgleich gleicht das aus.",
         "Der automatische Weißabgleich (AWB) ist meistens gut. Bei Stimmungen wie Sonnenuntergang, Nacht oder Sternen ist ein fester Wert (z. B. Tageslicht) besser, weil die Automatik die Stimmung sonst „wegkorrigiert“ und Serien unterschiedlich aussehen.",
         "Bei RAW lässt sich der Weißabgleich später ohne Verlust ändern."],
   merk:"Meistens Auto, bei Stimmungen fest einstellen.",see:[["grund","format","RAW oder JPEG"]]},
  {id:"format",title:"RAW oder JPEG",short:"Dateiformate und was sie bedeuten",
   text:["JPEG: Die Kamera bearbeitet das Foto fertig (Farben, Schärfe, Kontrast) und speichert es klein. Sofort nutzbar und trotzdem noch bearbeitbar, nur mit weniger Spielraum.",
         "RAW: Die Rohdaten des Sensors. Viel mehr Spielraum bei Helligkeit, Farben und Weißabgleich – aber RAW-Dateien muss man mit einem Programm entwickeln, bevor man sie teilen kann.",
         "RAW + JPEG: Beides gleichzeitig. Das JPEG ist sofort fertig, und das RAW hast du in Reserve, falls ein Foto die Mühe wert ist. Kostet mehr Speicherplatz.",
         "Bei Sternen und anderen schwierigen Nachtaufnahmen lohnt sich nur RAW, weil man da praktisch immer nachbearbeitet."],
   merk:"Im Zweifel RAW + JPEG.",see:[["grund","wb","Weißabgleich"]]},
  {id:"antrieb",title:"Antrieb (Bildfolge)",short:"Einzelbild, Serie, Selbstauslöser",
   text:["Einzelbild: ein Foto pro Druck.",
         "Serienbild: Solange du drückst, macht die Kamera Fotos in schneller Folge. Ideal für Tiere, Sport und Kinder – eines davon sitzt fast immer.",
         "Selbstauslöser: Löst nach 2 oder 10 Sekunden aus. Auf dem Stativ verhindert das Verwacklung durch den Fingerdruck – ein einfacher Ersatz für einen Fernauslöser."],
   merk:"Bewegung → Serie. Stativ → Selbstauslöser.",see:[]},
  {id:"stabi",title:"Bildstabilisator",short:"Gegen Verwacklung aus der Hand",
   text:["Ein Stabilisator gleicht kleine Bewegungen der Hand aus. Er sitzt im Objektiv (bei Sony „OSS“, bei Tamron „VC“) und/oder in der Kamera (Sensor-Stabilisierung).",
         "Damit sind aus der Hand längere Zeiten möglich als der Kehrwert der Brennweite. Angegeben wird das in Stufen: Jede Stufe verdoppelt die mögliche Zeit (2 Stufen = 4-mal, 4 Stufen = 16-mal so lang). Die Herstellerangabe steht in den technischen Daten; in der Praxis schafft man oft 1–2 Stufen weniger.",
         "Wichtig: Er hilft nur gegen deine Bewegung, nicht gegen die Bewegung des Motivs. Auf dem Stativ sollte man ihn meist ausschalten."],
   merk:"Hilft gegen Wackeln, nicht gegen Bewegung. Auf dem Stativ aus.",see:[["kamera","stabi","Stabilisator an der Kamera"]]},
  {id:"licht",title:"Licht",short:"Hart oder weich, Richtung und Tageszeit",
   text:["Licht entscheidet oft mehr über ein Foto als jede Einstellung. Drei Dinge machen den Unterschied: wie hart das Licht ist, aus welcher Richtung es kommt und welche Farbe es hat.",
         "Hartes Licht kommt von einer kleinen, direkten Lichtquelle, zum Beispiel der Sonne bei klarem Himmel. Es macht harte Schatten und starke Kontraste. Weiches Licht kommt von einer großen Fläche: bewölkter Himmel, Schatten, großes Fenster. Die Übergänge sind sanft – schmeichelhaft für Gesichter, Blüten und Tiere.",
         "Frontlicht (von hinter der Kamera) wirkt flach. Seitenlicht zeigt Formen und Strukturen besonders gut. Gegenlicht macht Silhouetten und leuchtende Ränder um Haare, Fell und Blätter.",
         "Die Tageszeit verändert alles: Mittags steht die Sonne hoch und das Licht ist hart. In der goldenen Stunde (Sonne knapp über dem Horizont) ist es warm, weich und macht lange Schatten. In der blauen Stunde (Sonne knapp unter dem Horizont) ist es kühl und gleichmäßig. Wie lange diese Phasen dauern, hängt von Jahreszeit und Ort ab – meist kürzer oder länger als genau eine Stunde."],
   merk:"Weiches Licht schmeichelt, hartes Licht betont. Morgens und abends ist das Licht am schönsten.",
   see:[["karte","gegenlicht","Gegenlicht und Silhouetten"],["karte","sonnenuntergang","Sonnenuntergang"],["grund","wb","Weißabgleich"]]},
  {id:"gestaltung",title:"Bildgestaltung",short:"Hauptmotiv, Drittelregel, Linien und Perspektive",
   text:["Erst entscheiden: Was ist mein Motiv? Alles, was davon ablenkt, möglichst weglassen – näher rangehen, Ausschnitt verkleinern, Standpunkt wechseln.",
         "Drittelregel: Das Bild gedanklich mit je zwei Linien waagerecht und senkrecht dritteln. Wichtige Dinge (Auge, Horizont, Baum) auf die Linien oder Schnittpunkte setzen statt genau in die Mitte. Der Goldene Schnitt ist eine ähnliche, etwas mittigere Aufteilung.",
         "Linien führen den Blick: Wege, Flüsse, Zäune oder Mauern, die ins Bild hineinlaufen, geben Tiefe und lenken zum Motiv. Ein deutlicher Vordergrund, Mittelgrund und Hintergrund machen ein Bild räumlich. Ein natürlicher Rahmen (Tor, Äste, Fenster) hält den Blick im Bild.",
         "Perspektive: Auf Augenhöhe wirkt ein Motiv nahbar, von unten (Froschperspektive) groß und mächtig, von oben (Vogelperspektive) klein oder übersichtlich. Hochformat passt zu hohen Motiven und Porträts, Querformat zu Weite.",
         "Symmetrie und Muster dürfen bewusst in die Mitte. Platz in Blick- oder Bewegungsrichtung lassen. Vor dem Auslösen Ränder und Hintergrund prüfen: Wächst ein Ast aus dem Kopf? Ist etwas halb angeschnitten?",
         "Diese Regeln sind Orientierungshilfen, keine Gesetze – wer sie kennt, kann sie auch bewusst brechen."],
   merk:"Was ist das Motiv? Alles, was nicht hilft, kommt raus.",
   sony:["Gitterlinien als Hilfe für die Drittelregel: MENU → [Gitterlinie] → [3x3 Raster]."],
   see:[["grund","licht","Licht"],["grund","schaerfe","Schärfentiefe"],["grund","brennweite","Brennweite"]]},
  {id:"farbe",title:"Farbe und Schwarzweiß",short:"Farbwirkung, Kontraste und wann Schwarzweiß passt",
   text:["Warme Farben (Rot, Orange, Gelb) wirken nah, lebendig und aktiv. Kalte Farben (Blau, Grün) wirken ruhig und distanziert.",
         "Komplementärfarben liegen sich im Farbkreis gegenüber: Blau und Orange, Rot und Grün, Gelb und Violett. Zusammen ergeben sie einen starken, auffälligen Kontrast. Ähnliche, benachbarte Farben wirken dagegen harmonisch und ruhig.",
         "Ein kleiner farbiger Punkt in einer ruhigen, eher farblosen Umgebung zieht den Blick sofort an (Farbakzent). Bilder mit nur einer Farbe in vielen Abstufungen (monochrom) wirken oft besonders stimmungsvoll.",
         "Schwarzweiß lenkt den Blick auf Formen, Linien, Strukturen, Kontraste und Licht. Es passt gut, wenn Farben ablenken oder langweilig sind – zum Beispiel bei grauem Himmel, Gewitterwolken oder ausdrucksstarken Gesichtern.",
         "Praktischer Trick: Mit RAW + JPEG und einem Schwarzweiß-Bildstil sieht man schon im Sucher in Schwarzweiß. Das JPEG ist schwarzweiß, das RAW bleibt farbig – man kann sich später noch umentscheiden."],
   merk:"Gegensätzliche Farben knallen, ähnliche beruhigen. Schwarzweiß zeigt Form und Licht.",
   sony:["Schwarzweiß-Bildstil: je nach Modell [Kreativmodus] oder [Kreativ-Look] → Schwarzweiß."],
   see:[["grund","licht","Licht"],["grund","format","RAW oder JPEG"],["grund","gestaltung","Bildgestaltung"]]},
  {id:"blitz",title:"Blitz",short:"Aufhellen, indirekt blitzen, Synchronzeit",
   text:["Der eingebaute Blitz ist klein und blitzt frontal – das macht flaches Licht und harte Schatten. Er reicht nur wenige Meter. Ein Aufsteckblitz ist stärker und lässt sich meist schwenken.",
         "Indirekt blitzen: Den Aufsteckblitz gegen eine helle Decke oder Wand richten. Das Licht kommt dann von einer großen Fläche und wird weich. Die Fläche sollte weiß sein, sonst färbt sie das Licht.",
         "Aufhellblitz: Bei Gegenlicht oder harter Mittagssonne hellt ein schwacher Blitz die Schatten im Gesicht auf. Dafür die Blitzkorrektur auf etwa −1 bis −2 stellen, damit es natürlich bleibt.",
         "Blitzsynchronzeit: Die kürzeste Verschlusszeit, bei der der Sensor im Moment des Blitzes ganz frei ist – meist etwa 1/160 bis 1/250 s. Bei kürzeren Zeiten wird ein Teil des Bildes schwarz. Manche Aufsteckblitze können mit Kurzzeitsynchronisation (HSS) auch kürzere Zeiten, dann aber mit weniger Leistung.",
         "Blitz auf den 2. Verschlussvorhang: Normalerweise blitzt es am Anfang der Belichtung. Bei langen Zeiten und Bewegung wirken Lichtspuren natürlicher, wenn der Blitz erst am Ende kommt – die Spuren liegen dann hinter dem Motiv.",
         "Langzeitsynchronisation: Blitz plus lange Belichtungszeit. Nachts wird so die Person vom Blitz hell und der Hintergrund mit seinen Lichtern trotzdem sichtbar (Stativ oder ruhige Hand).",
         "Mischlicht: Blitzlicht ist neutral bis kühl, Glühlampen sind warm – im gleichen Bild gibt das Farbstiche. Entfesselt blitzen (Blitz von der Seite, per Funk ausgelöst) bringt mehr Form ins Licht."],
   merk:"Als Aufheller dezent (−1 bis −2), drinnen lieber indirekt über die Decke.",
   sony:["Blitzmodus und Blitzkorrektur im Fn-Menü oder unter MENU → [Blitzmodus] bzw. [Blitzkompens.].","Typische Blitzmodi: [Aufhellblitz], Langzeitsynchronisation und Synchronisation auf den 2. Vorhang (Namen je nach Modell leicht verschieden)."],
   see:[["karte","aufhellblitz","Porträt im Gegenlicht mit Blitz"],["karte","gegenlicht","Gegenlicht und Silhouetten"],["grund","zeit","Belichtungszeit"]]},
  {id:"objektive",title:"Objektive und Zubehör",short:"Welches Objektiv wofür – und was sonst noch hilft",
   text:["Festbrennweite oder Zoom: Festbrennweiten haben eine feste Brennweite, sind oft lichtstärker, schärfer und leichter. Zooms decken einen Bereich ab und sind dadurch flexibel. Lichtstärke (die kleinste Blendenzahl, z. B. f/1.8) entscheidet, wie gut ein Objektiv bei wenig Licht und für unscharfe Hintergründe ist.",
         "Brennweiten hier als Kleinbild-Angabe. An APS-C entspricht das etwa der Zahl auf dem Objektiv geteilt durch 1,5 (z. B. 50 mm Kleinbild ≈ 33 mm an APS-C)."],
   list:["Ultraweitwinkel (unter ca. 24 mm): weite Landschaften, enge Räume, Architektur. Starke Perspektive, Nahes wirkt groß.",
         "Weitwinkel (ca. 24–35 mm): Landschaft, Stadt, Reise, Gruppen. Viel Schärfentiefe.",
         "Normalobjektiv (ca. 50 mm): natürlicher Blick wie das Auge, Alltag, Straße, Porträts mit Umgebung. Oft günstig und lichtstark.",
         "Leichtes Tele (ca. 85–135 mm): klassische Porträtbrennweite, Details. Schmeichelhafte Perspektive, weicher Hintergrund.",
         "Tele (ab ca. 200 mm): Tiere, Vögel, Sport, Mond. Holt Fernes heran, rückt Dinge optisch zusammen, wenig Schärfentiefe.",
         "Reise- oder Superzoom (z. B. 18–200 oder 18–300 mm an APS-C): ein Objektiv für fast alles, ideal auf Reisen. Kompromiss bei Lichtstärke und Bildqualität.",
         "Makroobjektiv (Maßstab 1:1): Insekten, Blüten, kleine Dinge. Längere Makros (ca. 90–100 mm) lassen mehr Abstand zum Motiv.",
         "Lichtstarke Festbrennweite (f/1.4–2): Innenräume ohne Blitz, Abend, Porträts mit sehr unscharfem Hintergrund."],
   list2:["Stativ: für lange Zeiten, Nacht, Wasser, Panorama. Dazu Fernauslöser, Handy-App oder Selbstauslöser.",
         "Streulichtblende: bessere Kontraste im Gegenlicht, schützt die Frontlinse.",
         "Polfilter: blauerer Himmel, weniger Spiegelungen auf Wasser und Blättern. Wirkt am stärksten im rechten Winkel zur Sonne; an Weitwinkeln kann der Himmel dadurch ungleichmäßig werden.",
         "Graufilter (ND): verlängert die Belichtungszeit bei Tag, z. B. für weiches Wasser oder Mitzieher.",
         "Grauverlaufsfilter: dunkelt nur den hellen Himmel ab, der Vordergrund bleibt hell.",
         "Nahlinsen und Zwischenringe: günstiger Einstieg in Nahaufnahmen ohne Makroobjektiv.",
         "Ersatzakku, zweite Speicherkarte, Mikrofasertuch und Blasebalg zum Reinigen."],
   merk:"Weit für Weite, Tele für Ferne, lichtstark für wenig Licht.",
   see:[["grund","brennweite","Brennweite und Crop-Faktor"],["karte","makro-tele","Makro mit dem Tele"],["rechner","graufilter","Rechner: Graufilter"]]}
];

  {id:"kehrwert",title:"Kehrwert der Brennweite",rule:"Längste Zeit aus der Hand ≈ 1 / (Brennweite × Crop-Faktor)",

  {id:"stufen",title:"Eine Stufe = doppelt oder halb so viel Licht",rule:"Zeit ×2, ISO ×2 oder Blende eine volle Stufe auf",

  {id:"bewegung",title:"Bewegung einfrieren",rule:"Gehen ~1/250 s · Laufen, spielender Hund ~1/1000 s · Vogel im Flug 1/2000 s und kürzer",
   text:"Richtwerte, abhängig von Abstand und Richtung: Was quer durchs Bild läuft, braucht kürzere Zeiten als etwas, das auf dich zukommt. Für weiches, fließendes Wasser dagegen 1/2 s und länger (Stativ)."},
  {id:"blendewahl",title:"Blende nach Motiv",rule:"Porträt und Tiere: offen · Landschaft: f/8–11 · Makro: f/8–16",

  {id:"sunny",title:"Sunny 16",rule:"Bei Sonnenschein: Blende f/16 und Zeit = 1/ISO",

function fmtTime(sec){
  if(sec>=1)return (Math.round(sec*10)/10).toString().replace(".",",")+" s";
  const std=[8000,4000,3200,2500,2000,1600,1250,1000,800,640,500,400,320,250,200,160,125,100,80,60,50,40,30,25,20,15,13,10,8,6,5,4,3,2];

}

function swUpdate(changed){
  const st=swState();
  st.sc=+$("#sw_sc").value; let a=+$("#sw_a").value, j=+$("#sw_j").value, i=+$("#sw_i").value;
  const sc=SW_SC[st.sc], LW=sc[1];
  const D=()=>3*LW-(a+3)-36+j+i;
  let clamped=false;
  const fix=(v,max)=>{const r=Math.round(v);const c=Math.min(max,Math.max(0,r));if(c!==r)clamped=true;return c};
  if(st.mode==="a")j=fix(j-D(),51);
  else if(st.mode==="s")a=fix(a+D(),24);
  else if(st.mode==="iso")i=fix(i-D(),24);
  $("#sw_a").value=a;$("#sw_j").value=j;$("#sw_i").value=i;
  ["a","j","i"].forEach(k=>{$("#sw_"+k).disabled=({a:"s",j:"a",i:"iso"})[k]===st.mode});
  Object.assign(st,{a,j,i});S.set("sw",st);
  const N=Math.pow(2,(a+3)/6), t=Math.pow(2,j/3-12), iso=100*Math.pow(2,i/3), dev=D()/3;
  $("#sw_av").textContent="f/"+SW_N[a].replace(".",",");$("#sw_tv").textContent=SW_T[j]+" s";$("#sw_iv").textContent="ISO "+SW_I[i];
  /* Bild */
  const pal={day:["#6fb1e8","#cfe7fa","#fff3b0",1,"#7fb069","#5f9a4f","#3e7a3a","#6aa84f",0],
             dusk:["#3a3f73","#f0a46b","#ffd28a",1,"#4f6a5a","#3e5a48","#2c4636","#4a6b45",0],
             night:["#0b1030","#28305a","#f4eccf",0.9,"#26334a","#1e2a3e","#151f2e","#24344a",0.4],
             stars:["#03050f","#0d1430","#f4eccf",0,"#121a2a","#0e1522","#0a0f18","#121a26",1]}[sc[2]];
  $("#sw_s1").setAttribute("stop-color",pal[0]);$("#sw_s2").setAttribute("stop-color",pal[1]);
  $("#sw_sun").setAttribute("fill",pal[2]);$("#sw_sun").setAttribute("opacity",pal[3]);
  $("#sw_h1").setAttribute("fill",pal[4]);$("#sw_h2").setAttribute("fill",pal[5]);$("#sw_trees").setAttribute("fill",pal[6]);$("#sw_gr").setAttribute("fill",pal[7]);
  $("#sw_stars").setAttribute("opacity",pal[8]);
  $("#sw_fbv").setAttribute("stdDeviation",Math.min(9,12/N).toFixed(2));
  const mb=Math.min(22,t*400);$("#sw_fmv").setAttribute("stdDeviation",mb.toFixed(2)+" 0");
  $("#sw_noise").setAttribute("opacity",Math.min(0.55,Math.max(0,i/3-1)*0.08).toFixed(2));
  const shown=Math.max(-4,Math.min(4,dev));
  /* zu hell: Schleier Richtung Weiß, zu dunkel: Richtung Schwarz */
  const ex=$("#sw_exp");ex.setAttribute("fill",shown>0?"#fff":"#000");
  ex.setAttribute("opacity",(shown>0?1-Math.pow(2,-shown*0.6):1-Math.pow(2,shown*0.7)).toFixed(3));
  $("#sw_mk").style.left=(50+Math.max(-3.3,Math.min(3.3,dev))/3*50*0.857)+"%";
  /* Texte */
  const r=Math.round(dev*3)/3, abs=Math.abs(r);
  const st3=x=>{const w=Math.floor(x+1e-9),f=Math.round((x-w)*3);return (w?String(w):"")+(f?(w?" ":"")+["","⅓","⅔"][f]:"")||"0"};
  $("#sw_ev").textContent=abs<0.34?"Belichtung passt":(abs>3?(r>0?"Viel zu hell":"Viel zu dunkel"):`${st3(abs)} ${abs>1?"Stufen":"Stufe"} zu ${r>0?"hell":"dunkel"}`);
  const Nd=parseFloat(SW_N[a]);
  const bg=Nd<=2.8?"sehr unscharf – die Blume hebt sich deutlich ab":Nd<=5.6?"leicht unscharf":Nd<=11?"ziemlich scharf":"fast alles scharf (bei f/16–22 wird das ganze Bild durch Beugung etwas weicher)";
  const mv=t<=1/2000?"eingefroren, auch die Flügel":t<=1/500?"fast eingefroren, Flügelspitzen evtl. leicht verwischt":t<=1/125?"Flügel verwischen":"stark verwischt";
  const ns=iso<=400?"kaum":iso<=1600?"wenig, meist kein Problem":iso<=6400?"sichtbar, vor allem in dunklen Bereichen":"deutlich";
  let h=`<div><b>Hintergrund:</b> ${bg}</div><div><b>Fliegender Vogel:</b> ${mv}</div><div><b>Rauschen:</b> ${ns} <span class="muted">(je nach Kamera)</span></div>`;
  if(t>=1/30)h+=`<div><b>Verwacklung:</b> aus der Hand wird es je nach Brennweite knapp – <a class="lk" href="#regeln/rechner-verwacklung">Rechner</a>, Stativ oder Stabilisator</div>`;
  $("#sw_res").innerHTML=h;
  const nm={a:"die Zeit",s:"die Blende",iso:"die ISO"}[st.mode];
  $("#sw_auto").textContent=st.mode==="m"?"Alles von Hand – so wie im M-Modus ohne ISO-Auto.":clamped?`Grenze erreicht: ${nm} lässt sich nicht weiter verstellen, deshalb stimmt die Belichtung nicht mehr. Ändere einen der anderen Werte.`:`Die Kamera stellt ${nm} so ein, dass die Belichtung passt (grauer Regler).`;
}

/* ---------- Sonne und Mond am Ort (Sonne nach NOAA/Meeus, Mond vereinfacht nach Meeus Kap. 47) ---------- */
const RAD=Math.PI/180;
function jdOf(date){return date.getTime()/86400000+2440587.5}
/* Sonne nach NOAA (Meeus): Deklination und Zeitgleichung */
function sunPos(date){
  const T=(jdOf(date)-2451545)/36525;
  const L0=(280.46646+T*(36000.76983+0.0003032*T))%360;
  const M=357.52911+T*(35999.05029-0.0001537*T);
  const e=0.016708634-T*(0.000042037+0.0000001267*T);
  const C=Math.sin(M*RAD)*(1.914602-T*(0.004817+0.000014*T))+Math.sin(2*M*RAD)*(0.019993-0.000101*T)+Math.sin(3*M*RAD)*0.000289;
  const om=125.04-1934.136*T;
  const lam=L0+C-0.00569-0.00478*Math.sin(om*RAD);
  const eps0=23+(26+(21.448-T*(46.815+T*(0.00059-T*0.001813)))/60)/60;
  const eps=eps0+0.00256*Math.cos(om*RAD);
  const dec=Math.asin(Math.sin(eps*RAD)*Math.sin(lam*RAD));
  const ra=Math.atan2(Math.cos(eps*RAD)*Math.sin(lam*RAD),Math.cos(lam*RAD));
  return {dec,ra,T};
}
function gmst(date){const d=jdOf(date)-2451545;return ((280.46061837+360.98564736629*d)%360+360)%360}
function altOf(ra,dec,date,lat,lon){
  const H=(gmst(date)+lon)*RAD-ra;
  return Math.asin(Math.sin(lat*RAD)*Math.sin(dec)+Math.cos(lat*RAD)*Math.cos(dec)*Math.cos(H))/RAD;
}
function sunAlt(date,lat,lon){const p=sunPos(date);return altOf(p.ra,p.dec,date,lat,lon)}
/* Mond, vereinfacht (Hauptterme nach Meeus Kap. 47), Genauigkeit wenige Minuten */
function moonPos(date){
  const d=jdOf(date)-2451545,T=d/36525;
  const L=218.3165+13.17639648*d, D=297.8502+12.19074912*d, M=357.5291+0.98560028*d, Mp=134.9634+13.06499295*d, F=93.2721+13.22935024*d;
  const s=x=>Math.sin(x*RAD);
  const lon=L+6.289*s(Mp)+1.274*s(2*D-Mp)+0.658*s(2*D)+0.214*s(2*Mp)-0.186*s(M)-0.114*s(2*F)+0.059*s(2*D-2*Mp)+0.057*s(2*D-M-Mp)+0.053*s(2*D+Mp)+0.046*s(2*D-M)-0.041*s(M-Mp)-0.035*s(D)-0.031*s(M+Mp);
  const lat=5.128*s(F)+0.281*s(Mp+F)+0.278*s(Mp-F)+0.173*s(2*D-F)+0.055*s(2*D-Mp+F)+0.046*s(2*D-Mp-F)+0.033*s(2*D+F)+0.017*s(2*Mp+F);
  const dist=385000.56-20905*Math.cos(Mp*RAD)-3699*Math.cos((2*D-Mp)*RAD)-2956*Math.cos(2*D*RAD);
  const eps=(23.439291-0.0130042*T)*RAD;
  const l=lon*RAD,b=lat*RAD;
  const ra=Math.atan2(Math.sin(l)*Math.cos(eps)-Math.tan(b)*Math.sin(eps),Math.cos(l));
  const dec=Math.asin(Math.sin(b)*Math.cos(eps)+Math.cos(b)*Math.sin(eps)*Math.sin(l));
  return {ra,dec,dist};
}
function moonAlt(date,lat,lon){
  const p=moonPos(date);const h=altOf(p.ra,p.dec,date,lat,lon);
  const par=Math.asin(6378.14/p.dist)/RAD;
  /* Höhe relativ zur Auf-/Untergangshöhe nach Meeus (h0 = 0,7275·Parallaxe − 0°34'): 0 = Mond geht auf/unter */
  return h-(0.7275*par-0.5667);
}
/* Alle Durchgänge einer Höhe zwischen start und end finden (Schritte 10 min, dann Halbierung) */
function crossings(fn,h0,start,end){
  const out=[];const step=10*60000;
  let t0=start.getTime(),a0=fn(new Date(t0))-h0;
  for(let t=t0+step;t<=end.getTime()+1;t+=step){
    const a1=fn(new Date(t))-h0;
    if((a0<0)!==(a1<0)){let lo=t-step,hi=t,alo=a0;
      for(let k=0;k<20;k++){const mid=(lo+hi)/2,am=fn(new Date(mid))-h0;if((am<0)===(alo<0)){lo=mid;alo=am}else hi=mid}
      out.push({t:new Date((lo+hi)/2),up:a1>a0});}
    a0=a1;
  }
  return out;
}

let skyDay=0; /* 0 = heute, 1 = morgen … */
const SK_COL={day:"#9fd0f0",gold:"#f2b84b",blue:"#3e6fd0",dusk:"#273569",night:"#121733"};
const SK_LBL={day:"Tag",gold:"Goldene Stunde",blue:"Blaue Stunde",dusk:"Dämmerung",night:"Nacht (dunkel)"};
function skZone(a){return a>6?"day":a>-4?"gold":a>-8?"blue":a>-18?"dusk":"night"}
function skyData(day,lat,lon){
  const s=new Date(day.getFullYear(),day.getMonth(),day.getDate()),e=new Date(s.getTime()+86400000);
  const fs=d=>sunAlt(d,lat,lon);
  const cr=h=>crossings(fs,h,s,e);
  const up=(h)=>(cr(h).find(x=>x.up)||{}).t, dn=(h)=>{const l=cr(h).filter(x=>!x.up);return (l[l.length-1]||{}).t};
  let noon=s,max=-99;for(let t=s.getTime();t<e.getTime();t+=5*60000){const a=fs(new Date(t));if(a>max){max=a;noon=new Date(t)}}
  const zones=[];for(let k=0;k<144;k++)zones.push(skZone(fs(new Date(s.getTime()+(k+0.5)*600000))));
  const mo=crossings(d=>moonAlt(d,lat,lon),0,s,e);
  const nEnd=(crossings(fs,-18,e,new Date(e.getTime()+14*3600000)).find(x=>x.up)||{}).t;
  return {s,e,noon,max,zones,
    rise:up(-0.833),set:dn(-0.833),b1:up(-8),b2:up(-4),g2:up(6),g1:dn(6),b3:dn(-4),b4:dn(-8),n1:up(-18),n2:dn(-18),nEnd,
    mrise:(mo.find(x=>x.up)||{}).t,mset:(mo.find(x=>!x.up)||{}).t,minNight:Math.min(...zones.map((z,k)=>fs(new Date(s.getTime()+(k+0.5)*600000))))};
}
const tm=d=>d?fmtT(d):"–";
function skyLoc(){return S.get("loc",null)}
function skyDayDate(){const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate()+skyDay)}
function skyTabNow(sub){const t=(sub==="mond"||sub==="sonne")?sub:S.get("skytab","sonne");return t}

  return head+(tab==="mond"?skyMoon(day,loc):skySun(day,loc));
}
function skySun(day,loc){

  const now=new Date(),d=skyData(day,loc.lat,loc.lon);
  const W=144;let bar="";for(let k=0;k<W;){let j=k;while(j<W&&d.zones[j]===d.zones[k])j++;bar+=`<rect x="${k}" y="0" width="${j-k+0.3}" height="10" fill="${SK_COL[d.zones[k]]}"/>`;k=j}

  </div>
  <div class="card"><b>Morgens</b><div class="sk-t">
    <b>${range(d.b1,d.b2)}</b><span>Blaue Stunde</span>
    <b>${tm(d.rise)}</b><span>Sonnenaufgang</span>
    <b>${range(d.b2,d.g2)}</b><span>Goldene Stunde</span></div></div>

}

/* ---------- Mondphasen (Berechnung nach J. Meeus, Astronomical Algorithms) ---------- */
function moonPhaseJD(k,phase){ // phase 0 new,1 first q,2 full,3 last q ; k integer
  const kk=k+phase/4, T=kk/1236.85, d=Math.PI/180;

  const E=1-0.002516*T-0.0000074*T*T;
  const M=(2.5534+29.1053567*kk-0.0000014*T*T-0.00000011*T**3)*d;
  const Mp=(201.5643+385.81693528*kk+0.0107582*T*T+0.00001238*T**3-0.000000058*T**4)*d;
  const F=(160.7108+390.67050284*kk-0.0016118*T*T-0.00000227*T**3+0.000000011*T**4)*d;
  const Om=(124.7746-1.56375588*kk+0.0020672*T*T+0.00000215*T**3)*d;
  const s=Math.sin,c=Math.cos;let corr;
  if(phase===0||phase===2){
    const a=phase===0?[-0.40720,0.17241,0.01608,0.01039,0.00739,-0.00514,0.00208]:[-0.40614,0.17302,0.01614,0.01043,0.00734,-0.00515,0.00209];
    corr=a[0]*s(Mp)+a[1]*E*s(M)+a[2]*s(2*Mp)+a[3]*s(2*F)+a[4]*E*s(Mp-M)+a[5]*E*s(Mp+M)+a[6]*E*E*s(2*M)
      -0.00111*s(Mp-2*F)-0.00057*s(Mp+2*F)+0.00056*E*s(2*Mp+M)-0.00042*s(3*Mp)+0.00042*E*s(M+2*F)+0.00038*E*s(M-2*F)-0.00024*E*s(2*Mp-M)-0.00017*s(Om)-0.00007*s(Mp+2*M)+0.00004*s(2*Mp-2*F)+0.00004*s(3*M)+0.00003*s(Mp+M-2*F)+0.00003*s(2*Mp+2*F)-0.00003*s(Mp+M+2*F)+0.00003*s(Mp-M+2*F)-0.00002*s(Mp-M-2*F)-0.00002*s(3*Mp+M)+0.00002*s(4*Mp);
  } else {
    corr=-0.62801*s(Mp)+0.17172*E*s(M)-0.01183*E*s(Mp+M)+0.00862*s(2*Mp)+0.00804*s(2*F)+0.00454*E*s(Mp-M)+0.00204*E*E*s(2*M)-0.0018*s(Mp-2*F)-0.0007*s(Mp+2*F)-0.0004*s(3*Mp)-0.00034*E*s(2*Mp-M)+0.00032*E*s(M+2*F)+0.00032*E*s(M-2*F)-0.00028*E*E*s(Mp+2*M)+0.00027*E*s(2*Mp+M)-0.00017*s(Om)-0.00005*s(Mp-M-2*F)+0.00004*s(2*Mp+2*F)-0.00004*s(Mp+M+2*F)+0.00004*s(Mp-2*M)+0.00003*s(Mp+M-2*F)+0.00003*s(3*M)+0.00002*s(2*Mp-2*F)+0.00002*s(Mp-M+2*F)-0.00002*s(3*Mp+M);
    const W=0.00306-0.00038*E*c(M)+0.00026*c(Mp)-0.00002*c(Mp-M)+0.00002*c(Mp+M)+0.00002*c(2*F);
    corr+=phase===1?W:-W;
  }
  return JDE+corr-69/86400; // TT->UT approx
}
const jdToDate=jd=>new Date((jd-2440587.5)*86400000);

const SYN=29.530588861;
function kNear(date){return Math.floor(((date.getTime()/86400000+2440587.5)-2451550.09766)/SYN);}
function phaseList(from,count){
  const out=[];let k=kNear(from)-1;
  while(out.length<count){for(let p=0;p<4;p++){const d=jdToDate(moonPhaseJD(k,p));if(d>=from&&out.length<count)out.push({p,d});}k++;}
  return out;
}
function moonNow(now){
  let k=kNear(now)+1;let nm=jdToDate(moonPhaseJD(k,0));
  while(nm>now){k--;nm=jdToDate(moonPhaseJD(k,0));}
  const next=jdToDate(moonPhaseJD(k+1,0));
  const P=(next-nm)/86400000, age=(now-nm)/86400000, th=2*Math.PI*age/P;
  const illum=(1-Math.cos(th))/2;
  const fq=jdToDate(moonPhaseJD(k,1)),fm=jdToDate(moonPhaseJD(k,2)),lq=jdToDate(moonPhaseJD(k,3));
  const near=(d)=>Math.abs(now-d)<0.9*86400000;

  if(near(nm)||near(next))name="Neumond";else if(near(fm))name="Vollmond";else if(near(fq))name="Erstes Viertel (zunehmender Halbmond)";else if(near(lq))name="Letztes Viertel (abnehmender Halbmond)";
  else if(now<fq)name="Zunehmende Sichel";else if(now<fm)name="Zunehmender Mond";else if(now<lq)name="Abnehmender Mond";else name="Abnehmende Sichel";
  return {age,P,th,illum,name,waxing:now<fm};
}
function moonSVG(th,size){
  const r=45,c=50;const wax=th<=Math.PI;const t=wax?th:2*Math.PI-th;const x=r*Math.cos(t);
  const path=`M ${c},${c-r} A ${r} ${r} 0 0 1 ${c},${c+r} A ${Math.abs(x)} ${r} 0 0 ${x>0?0:1} ${c},${c-r} Z`;
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" aria-hidden="true"><circle cx="50" cy="50" r="45" fill="#3b4256"/><path d="${path}" fill="#f4eccf" ${wax?"":'transform="translate(100,0) scale(-1,1)"'}/><circle cx="50" cy="50" r="45" fill="none" stroke="#8a90a2" stroke-width="1"/></svg>`;
}

const fmtT=d=>d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});

  ${land}

      <p>Wie viele Stufen dein Objektiv oder deine Kamera schafft, steht in den technischen Daten, meist auf der Seite des Herstellers – z. B. „bis zu 4 Stufen“ oder „4,5 EV“. Hat dein Objektiv und deine Kamera keinen Stabilisator, wähle „ohne“.</p>

function calcAll(){
  const crop=cropNow().f;
  const f=parseFloat($("#cv_f")?.value);
  if($("#cv_r")){
    if(f>0){const s=+$("#cv_s").value;const t=Math.pow(2,s)/(f*crop);
      $("#cv_r").textContent="≈ "+fmtTime(t);
      $("#cv_n").textContent=`Entspricht ${Math.round(f*crop)} mm an Vollformat (Faktor ${num(crop)}). ${s?`Mit ${s} Stufe${s>1?"n":""} Stabilisator ${Math.pow(2,s)}-mal länger als ohne. `:""}Gilt nur gegen Verwackeln, nicht gegen Bewegung des Motivs.`;
      S.set("cv_f",f);S.set("cv_s",$("#cv_s").value);}
    else {$("#cv_r").textContent="";$("#cv_n").textContent="Bitte eine Brennweite eingeben.";}
  }
  const fs=parseFloat($("#cs_f")?.value);
  if($("#cs_r")){
    const c=cropNow(),N=parseFloat($("#cs_n_").value),mp=parseFloat($("#cs_mp").value);
    if(fs>0&&mp>0){const t5=500/(fs*crop);const px=Math.sqrt(mp*1e6*c.ar);const pitch=c.w/px*1000;const tn=(35*N+30*pitch)/fs;
      $("#cs_r").textContent="NPF-Regel: ≈ "+Math.floor(tn)+" s";
      $("#cs_r2").textContent="500er-Regel: ≈ "+Math.floor(t5)+" s";
      $("#cs_n").textContent="Die NPF-Regel ist strenger und berücksichtigt auch Blende und Pixelgröße (hier ca. "+num(pitch)+" µm) – damit bleiben Sterne auch in großer Ansicht punktförmig. Die 500er-Regel reicht für kleinere Ansichten.";
      S.set("cs_f",fs);S.set("cs_n_",$("#cs_n_").value);S.set("cs_mp",mp);}
    else {$("#cs_r").textContent="";$("#cs_r2").textContent="";$("#cs_n").textContent="Bitte Brennweite und Megapixel eingeben.";}
  }
  if($("#cd_r")){
    const c=cropNow(),f=parseFloat($("#cd_f").value),N=parseFloat($("#cd_n").value),sm=parseFloat(String($("#cd_s").value).replace(",","."));
    const fm=v=>v>=1000?num(v/1000)+" m":Math.round(v/10)+" cm";
    if(f>0&&sm>0){const sd=sm*1000;const H=f*f/(N*c.coc)+f;const near=sd*(H-f)/(H+sd-2*f);const far=sd>=H?Infinity:sd*(H-f)/(H-sd);
      $("#cd_r").textContent=far===Infinity?`scharf ab ${fm(near)} bis unendlich`:`scharf von ${fm(near)} bis ${fm(far)}`;
      $("#cd_r2").textContent=(far===Infinity?"":`Schärfentiefe gesamt: ${fm(far-near)} · `)+`Hyperfokale Distanz: ${fm(H)}`;
      $("#cd_x").textContent=`Stellst du auf die hyperfokale Distanz scharf, ist alles von etwa ${fm(H/2)} bis unendlich scharf. Richtwerte für normale Betrachtung (Zerstreuungskreis ${String(c.coc).replace(".",",")} mm).`;
      S.set("cd_f",f);S.set("cd_n",$("#cd_n").value);S.set("cd_s",sm);}
    else {$("#cd_r").textContent="";$("#cd_r2").textContent="";$("#cd_x").textContent="Bitte Brennweite und Abstand eingeben.";}
  }
  if($("#cg_r")){
    const tv=$("#cg_t").value;const base=tv.includes("/")?1/parseFloat(tv.split("/")[1]):parseFloat(tv);
    const t=base*Math.pow(2,+$("#cg_n").value);
    $("#cg_r").textContent="≈ "+(t>=60?(Math.round(t/6)/10).toString().replace(".",",")+" min":fmtTime(t));
    S.set("cg_t",tv);S.set("cg_n",$("#cg_n").value);
  }
}

/* ---------- Router ---------- */
function render(){
  const q=$("#q").value;
  const hash=location.hash.slice(1)||"motive";
  const [tab,sub]=hash.split("/");
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  let h;
  if(q.trim())h=viewSearch(q);
  else if(tab==="motive")h=sub?viewCard(sub):viewMotive();
  else if(tab==="grundlagen")h=sub?viewGrund(sub):viewGrundlagen();
  else if(tab==="regeln")h=sub==="spielwiese"?viewSpiel():viewRegeln();
  else if(tab==="kamera")h=sub?viewKam(sub):viewKamera();
  else if(tab==="glossar")h=viewGlossar();
  else if(tab==="himmel"||tab==="mond")h=viewHimmel(sub);
  else h=viewMotive();
  $("#main").innerHTML=h;
  bind(tab,sub);
}

function bind(tab,sub){
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{motivFilter=b.dataset.f;render()});
  document.querySelectorAll("[data-fav]").forEach(b=>b.onclick=()=>{const k=b.dataset.fav;let f=S.get("fav",[]);if(f.includes(k)){f=f.filter(x=>x!==k);toast("Nicht mehr gemerkt")}else{f.push(k);toast("Gemerkt")}S.set("fav",f);b.classList.toggle("on")});
  document.querySelectorAll("[data-sensor]").forEach(b=>b.onclick=()=>openSensor(false));
  if(tab==="motive"&&sub){
    document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{S.set("var_"+sub,+b.dataset.v);const y=scrollY;render();scrollTo(0,y)});
    const n=$("#note");if(n)n.oninput=()=>S.set("note_"+sub,n.value);
  }
  if(tab==="himmel"||tab==="mond"){
    document.querySelectorAll("[data-loc]").forEach(b=>b.onclick=openLoc);
    const keep=()=>{const y=scrollY;render();scrollTo(0,y)};
    document.querySelectorAll("[data-skd]").forEach(b=>b.onclick=()=>{skyDay=+b.dataset.skd;keep()});
    const pv=$("#sk_prev"),nx=$("#sk_next");if(pv)pv.onclick=()=>{skyDay--;keep()};if(nx)nx.onclick=()=>{skyDay++;keep()};
    document.querySelectorAll("[data-skt]").forEach(b=>b.onclick=()=>{S.set("skytab",b.dataset.skt);const y=scrollY;history.replaceState(null,"","#himmel/"+b.dataset.skt);lastHash=location.hash;render();scrollTo(0,y)});
    const di=$("#sk_date");if(di)di.onchange=()=>{if(!di.value)return;const [Y,M,D]=di.value.split("-").map(Number);const n=new Date();skyDay=Math.round((new Date(Y,M-1,D)-new Date(n.getFullYear(),n.getMonth(),n.getDate()))/86400000);keep()};
  }
  if(tab==="regeln"&&sub==="spielwiese"){
    ["#sw_sc","#sw_a","#sw_j","#sw_i"].forEach(s=>{const e=$(s);e.oninput=e.onchange=()=>swUpdate(s)});
    document.querySelectorAll("[data-swm]").forEach(b=>b.onclick=()=>{const st=swState();st.mode=b.dataset.swm;S.set("sw",st);document.querySelectorAll("[data-swm]").forEach(x=>x.classList.toggle("on",x===b));swUpdate()});
    swUpdate();
  }
  else if(tab==="regeln"){
    ["#cv_f","#cv_s","#cs_f","#cs_n_","#cs_mp","#cd_f","#cd_n","#cd_s","#cg_t","#cg_n"].forEach(s=>{const e=$(s);if(e)e.oninput=e.onchange=calcAll});
    calcAll();
    if(sub){const el=document.getElementById(sub.startsWith("rechner-")?sub:"regel-"+sub);if(el)setTimeout(()=>el.scrollIntoView({block:"start"}),30)}
  }
  if(location.hash!==lastHash&&!(tab==="regeln"&&sub)){scrollTo(0,0)}
  lastHash=location.hash;
}

/* ---------- Start ---------- */
function init(){
  applyTheme();
  $("#logoTop").innerHTML=LOGO;$("#helpBtn").innerHTML=I.help;$("#helpBtn").onclick=openHelp;$("#optBtn").innerHTML=I.gear;$("#optBtn").onclick=openOptions;
  $("#searchIcon").innerHTML=I.search;
  $("#nav").innerHTML=TABS.map(t=>`<button data-tab="${t.id}">${I[t.icon]}<span>${t.name}</span></button>`).join("");
  document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{$("#q").value="";location.hash=b.dataset.tab;render()});
  $("#q").addEventListener("input",render);
  $("#main").addEventListener("click",e=>{const a=e.target.closest("a[href^='#']");if(a&&$("#q").value){$("#q").value=""}});
  window.addEventListener("hashchange",render);
  render();
  if(!S.get("welcomed",false)){
    const w=document.createElement("div");w.className="welcome";
    w.innerHTML=`<span class="logo">${LOGO}</span><h1>Blitzschnell</h1><p>Kurz nachgeschaut –</p><p>scharf getroffen</p><button class="btn primary">Los geht's</button>`;
    w.querySelector("button").onclick=()=>{S.set("welcomed",true);w.remove();if(S.get("crop",null)===null)openSensor(true)};
    document.body.appendChild(w);
  } else if(S.get("crop",null)===null){openSensor(true)}
  if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
}
init();
</script>
</body>
</html>
