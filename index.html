<style>
:root{
  --bg:#f4f5f8;--card:#ffffff;--card2:#eceef3;--text:#1b1f2a;--muted:#5d6475;--line:#d9dce4;
  --accent:#e0a100;--accentText:#7a5600;--accentBg:#fff4d1;--link:#2563c9;--warn:#b54708;--warnBg:#fff1e6;
  --nav:#ffffff;
}
[data-theme="dark"]{
  --bg:#15181f;--card:#1f232d;--card2:#282d39;--text:#eceef3;--muted:#a3aabb;--line:#343a48;
  --accent:#ffc21a;--accentText:#ffd666;--accentBg:#3a3220;--link:#7fb0ff;--warn:#ffb074;--warnBg:#3a2a1e;
  --nav:#1b1f28;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
a{color:var(--link)}
.wrap{max-width:640px;margin:0 auto;padding:0 14px 96px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 14px 8px;max-width:640px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:10px}
.topbar .logo{width:34px;height:34px;display:flex}.logo svg{width:100%;height:100%}
.topbar h1{font-size:20px;margin:0;flex:1;font-weight:600}
.iconbtn{background:none;border:0;padding:6px;border-radius:8px;cursor:pointer;display:flex}
.iconbtn svg{width:24px;height:24px}
.search{margin-top:8px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 10px}
.search input{flex:1;border:0;background:none;color:var(--text);font:inherit;padding:10px 0;outline:none}
.search svg{width:18px;height:18px;color:var(--muted)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--nav);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;max-width:640px;width:100%}
nav button{flex:1;background:none;border:0;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);cursor:pointer}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--text)}
nav button.on svg{color:var(--accent)}
h2{font-size:19px;margin:18px 0 8px}
h3{font-size:16px;margin:16px 0 6px}
.muted{color:var(--muted)}
.small{font-size:14px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:left;width:100%}
.item .ic{width:38px;height:38px;border-radius:50%;background:var(--accentBg);color:var(--accentText);display:flex;align-items:center;justify-content:center;flex:none}
.item .ic svg{width:20px;height:20px}
.item .t{font-weight:600}
.item .s{font-size:13.5px;color:var(--muted)}
.item .grow{flex:1;min-width:0}
.item.soon{opacity:.55;cursor:default}
.badge{font-size:11.5px;background:var(--card2);color:var(--muted);border-radius:6px;padding:2px 7px;white-space:nowrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer}
.chip.on{background:var(--accentBg);border-color:var(--accent);color:var(--accentText)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}
.head{display:flex;align-items:center;gap:12px}
.head .ic{width:46px;height:46px;border-radius:50%;background:var(--accentBg);color:var(--accentText);display:flex;align-items:center;justify-content:center;flex:none}
.head .ic svg{width:24px;height:24px}
.head .crumb{font-size:13px;color:var(--muted)}
.head .title{font-size:22px;font-weight:600;line-height:1.2}
.star{background:none;border:0;cursor:pointer;padding:6px;color:var(--muted)}
.star svg{width:26px;height:26px}
.star.on{color:var(--accent)}
.star.on svg{fill:var(--accent)}
.intro{color:var(--muted);margin:10px 0 0}
.seg{display:flex;gap:8px;margin-top:14px}
.seg button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px;cursor:pointer;font-size:14.5px}
.seg button.on{background:var(--accentBg);border-color:var(--accent);color:var(--accentText);font-weight:600}
.sec h3{display:flex;align-items:center;gap:8px}
.sec h3 svg{width:18px;height:18px;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cell{background:var(--card2);border-radius:10px;padding:8px 10px}
.cell .l{font-size:12.5px;color:var(--muted)}
.cell .v{font-weight:600;font-size:15px}
.cell.changed{outline:2px solid var(--accent)}
.lk{color:var(--link);text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
ul{margin:4px 0;padding-left:20px}
li{margin:3px 0}
.box{background:var(--card2);border-radius:12px;padding:10px 12px;margin-top:14px}
.box summary{cursor:pointer;font-weight:600;display:flex;align-items:center;gap:8px;list-style:none}
.box summary::-webkit-details-marker{display:none}
.box summary svg{width:18px;height:18px}
.box summary .chev{margin-left:auto;transition:transform .2s}
.box[open] summary .chev{transform:rotate(180deg)}
.try{border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:14px}
.try b{display:flex;align-items:center;gap:8px}
.try svg{width:18px;height:18px;color:var(--accent)}
.warnbox{background:var(--warnBg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:14.5px;margin-top:10px}
textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:10px;background:var(--card2);color:var(--text);font:inherit;padding:8px}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;cursor:pointer;color:var(--link);padding:10px 0 0;font-size:15px}
.back svg{width:18px;height:18px}
.rule{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px}
.rule .t{font-weight:600}
.rule .r{background:var(--accentBg);color:var(--accentText);border-radius:8px;padding:6px 10px;margin:6px 0;font-weight:600}
.calc label{display:block;font-size:14px;color:var(--muted);margin-top:10px}
.calc input,.calc select,.opt select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card2);color:var(--text);font:inherit}
.result{font-size:22px;font-weight:700;margin-top:12px}
.opt{margin-top:14px}
.opt .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1b1f2a;font-weight:600}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.gl dt{font-weight:600;margin-top:12px}
.gl dd{margin:2px 0 0}
.letter{font-size:13px;color:var(--muted);margin-top:16px;border-bottom:1px solid var(--line)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center;overscroll-behavior:contain}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:90vh;max-height:90dvh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-radius:18px 18px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
@media (min-width:700px){.overlay{align-items:center;padding:24px}.sheet{border-radius:18px;max-height:85vh}}
body.noscroll{overflow:hidden}
.sheet .sh{display:flex;align-items:center;position:sticky;top:-16px;background:var(--bg);margin:-16px -16px 0;padding:12px 16px;z-index:1;border-bottom:1px solid var(--line)}
.sheet .sh h2{flex:1;margin:0}
.welcome{position:fixed;inset:0;background:#1d2230;color:#f2f2f2;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.welcome .logo{width:132px;height:132px;display:block}
.welcome h1{font-size:34px;margin:20px 0 6px}
.welcome p{margin:2px 0;color:#c9cdd8;font-size:17px}
.welcome .btn{margin-top:30px;font-size:17px;padding:12px 28px}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:10px;z-index:40;font-size:14.5px}
.mark{background:var(--accentBg);color:var(--accentText);border-radius:3px}
</style>
</head>

  {id:"zeit",title:"Belichtungszeit",short:"Wie lange Licht auf den Sensor fällt",

  {id:"iso",title:"ISO",short:"Wie stark das Bildsignal verstärkt wird",

  {id:"dreieck",title:"Zusammenspiel: Zeit, Blende, ISO",short:"Das Belichtungsdreieck",

         "Beispiel: Für einen fliegenden Vogel brauchst du eine kürzere Zeit (1/2000 statt 1/500 s = zwei Stufen weniger Licht). Das gleichst du mit offenerer Blende oder höherer ISO aus.",
         "Jeder Wert hat eine Nebenwirkung: Zeit → Bewegung, Blende → Schärfentiefe, ISO → Rauschen. Überleg dir, was beim Motiv am wichtigsten ist, und lege diesen Wert zuerst fest."],
   merk:"Erst den wichtigsten Wert festlegen, die anderen ausgleichen lassen.",see:[["regel","stufen","Lichtstufen"],["grund","modus","Belichtungsprogramme"]]},
  {id:"modus",title:"Belichtungsprogramme",short:"Auto, P, A, S und M",
   text:["Auto: Die Kamera entscheidet alles. Bequem, aber du hast keinen Einfluss.",
         "P (Programmautomatik): Die Kamera wählt Zeit und Blende, du kannst ISO, Belichtungskorrektur usw. einstellen.",
         "A (Blendenpriorität, bei anderen Herstellern Av): Du wählst die Blende, die Kamera die Zeit. Gut, wenn die Schärfentiefe wichtig ist (Porträt, Landschaft).",
         "S (Zeitpriorität, bei anderen Herstellern Tv): Du wählst die Zeit, die Kamera die Blende. Gut, wenn Bewegung wichtig ist (Tiere, Sport). Anfängerfreundlich.",
         "M (Manuell): Du wählst Zeit und Blende selbst. Mit ISO-Auto gleicht die Kamera die Helligkeit über die ISO aus – so hast du volle Kontrolle und trotzdem eine automatische Belichtung. Ohne ISO-Auto bestimmst du alles selbst, z. B. bei Sternen oder dem Mond."],
   merk:"Bewegung wichtig → S. Schärfentiefe wichtig → A. Beides wichtig → M + ISO-Auto.",see:[["grund","korrektur","Belichtungskorrektur"],["kamera","isoauto","ISO-Auto mit Mindestzeit"]]},
  {id:"korrektur",title:"Belichtungskorrektur und Histogramm",short:"Wenn die Kamera sich verschätzt",
   text:["Die Belichtungsmessung der Kamera geht davon aus, dass ein Motiv im Durchschnitt mittelgrau ist. Bei sehr hellen Motiven (Schnee, heller Himmel) wird das Foto deshalb zu dunkel, bei sehr dunklen Motiven zu hell.",
         "Mit der Belichtungskorrektur (+/−) sagst du der Kamera: „Mach es heller“ bzw. „dunkler“. Sie funktioniert in P, A und S, bei vielen Kameras (z. B. Sony) auch in M mit ISO-Auto.",
         "Das Histogramm zeigt die Helligkeitsverteilung: links dunkel, rechts hell. Stößt der Berg rechts an den Rand, sind helle Stellen ausgefressen – die sind auch per Bearbeitung nicht mehr zu retten."],
   merk:"Helles Motiv → plus. Dunkles Motiv → minus.",see:[["regel","korr","Korrigieren bei Hell und Dunkel"],["kamera","zebra","Zebra"]]},
  {id:"fokus",title:"Fokus und Autofokus",short:"AF-S, AF-C, MF und Fokusfelder",
   text:["AF-S (Einzelbild-AF): Die Kamera stellt einmal scharf, wenn du den Auslöser halb drückst, und hält diese Entfernung. Gut für Unbewegtes.",
         "AF-C (Nachführ-AF): Die Kamera stellt laufend nach, solange du den Auslöser halb drückst. Für alles, was sich bewegt.",
         "MF (manuell): Du drehst selbst am Fokusring. Hilfen dafür sind Fokuslupe und Fokus-Peaking. Gut bei Sternen, Makro oder wenn der Autofokus durch Zweige abgelenkt wird.",
         "Das Fokusfeld legt fest, wo im Bild die Kamera scharfstellt: Breit (Kamera sucht selbst), Zone (ein gewählter Bereich, bei Sony „Feld“), Spot (ein kleiner Punkt, bei Sony „Flexible Spot“) oder Tracking (das Motiv wird verfolgt). Augen-AF stellt gezielt auf Augen scharf."],
   merk:"Steht still → AF-S. Bewegt sich → AF-C. Autofokus versagt → MF.",see:[["kamera","augenaf","Augen-AF"],["kamera","peaking","Fokus-Peaking und Fokuslupe"]]},
  {id:"schaerfe",title:"Schärfentiefe",short:"Wie viel vor und hinter dem Motiv scharf ist",
   text:["Scharf ist immer nur eine Ebene. Davor und dahinter gibt es einen Bereich, der noch scharf wirkt – die Schärfentiefe.",
         "Wenig Schärfentiefe (unscharfer Hintergrund) bekommst du mit: offener Blende, langer Brennweite, geringem Abstand zum Motiv und viel Abstand zwischen Motiv und Hintergrund.",
         "Viel Schärfentiefe (alles scharf, z. B. Landschaft) bekommst du mit: geschlossener Blende (f/8–11), kurzer Brennweite und größerem Abstand."],
   merk:"Hintergrund unscharf: Blende auf, nah ran, Hintergrund weit weg.",see:[["grund","blende","Blende"]]},
  {id:"brennweite",title:"Brennweite und Crop-Faktor",short:"Wie groß das Motiv abgebildet wird",
   text:["Die Brennweite in Millimetern bestimmt den Bildausschnitt: Kurze Brennweiten (Weitwinkel) zeigen viel, lange Brennweiten (Tele) holen Entferntes heran.",
         "Der Sensor einer APS-C-Kamera (z. B. Sony a6000er-Reihe) ist kleiner als Kleinbild/Vollformat. Dadurch wirkt der Bildausschnitt enger, ungefähr wie die 1,5-fache Brennweite: 300 mm an APS-C wirken wie 450 mm an Vollformat. Bei Micro-Four-Thirds ist der Faktor 2.",
         "Für Faustregeln wie den Kehrwert der Brennweite rechnet man mit der umgerechneten Brennweite. Die Sensorgröße kannst du in den Optionen einstellen."],
   merk:"APS-C: Brennweite × 1,5. MFT: × 2.",see:[["regel","kehrwert","Kehrwert der Brennweite"]]},
  {id:"wb",title:"Weißabgleich",short:"Damit Weiß auch weiß aussieht",

         "Der automatische Weißabgleich (AWB) ist meistens gut. Bei Stimmungen wie Sonnenuntergang, Nacht oder Sternen ist ein fester Wert (z. B. Tageslicht) besser, weil die Automatik die Stimmung sonst „wegkorrigiert“ und Serien unterschiedlich aussehen.",
         "Bei RAW lässt sich der Weißabgleich später ohne Verlust ändern."],
   merk:"Meistens Auto, bei Stimmungen fest einstellen.",see:[["grund","format","RAW oder JPEG"]]},
  {id:"format",title:"RAW oder JPEG",short:"Dateiformate und was sie bedeuten",
   text:["JPEG: Die Kamera bearbeitet das Foto fertig (Farben, Schärfe, Kontrast) und speichert es klein. Sofort nutzbar und trotzdem noch bearbeitbar, nur mit weniger Spielraum.",
         "RAW: Die Rohdaten des Sensors. Viel mehr Spielraum bei Helligkeit, Farben und Weißabgleich – aber RAW-Dateien muss man mit einem Programm entwickeln, bevor man sie teilen kann.",
         "RAW + JPEG: Beides gleichzeitig. Das JPEG ist sofort fertig, und das RAW hast du in Reserve, falls ein Foto die Mühe wert ist. Kostet mehr Speicherplatz.",

const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
function href(type,id){return {karte:"#motive/",grund:"#grundlagen/",regel:"#regeln/",rechner:"#regeln/rechner-",kamera:"#kamera/"}[type]+id}
function seeLinks(arr){
  if(!arr||!arr.length)return"";
  return `<div class="sec"><h3>${I.link}Siehe auch</h3><div class="small">${arr.map(s=>`<a class="lk" href="${href(s[0],s[1])}">${esc(s[2])}</a>`).join(" · ")}</div></div>`;
}
function sonyBox(lines){
  if(!lines||!lines.length||!S.get("sony",true))return"";
  return `<details class="box"><summary>${I.camera} So geht's bei Sony <span class="chev">${I.chev}</span></summary><ul class="small">${lines.map(l=>`<li>${esc(l)}</li>`).join("")}</ul></details>`;
}
function fmtTime(sec){
  if(sec>=1)return (Math.round(sec*10)/10).toString().replace(".",",")+" s";
  const std=[8000,4000,3200,2500,2000,1600,1250,1000,800,640,500,400,320,250,200,160,125,100,80,60,50,40,30,25,20,15,13,10,8,6,5,4,3,2];
  const d=1/sec;let best=std[0];
  for(const s of std){if(s>=d-0.001)best=s;else break}
  return "1/"+best+" s";
}

  <div class="card calc" id="rechner-sterne"><b>Längste Zeit für Sterne (500er-Regel)</b>
    <label>Brennweite (mm, wie auf dem Objektiv)</label><input id="cs_f" type="number" inputmode="numeric" value="${S.get("cs_f",16)}" min="1">
    <div class="result" id="cs_r"></div><div class="small muted" id="cs_n"></div></div>
  <div class="card calc" id="rechner-graufilter"><b>Belichtungszeit mit Graufilter</b>
    <label>Zeit ohne Filter</label><select id="cg_t">${["1/1000","1/500","1/250","1/125","1/60","1/30","1/15","1/8","1/4","1/2","1"].map(t=>`<option ${S.get("cg_t","1/125")===t?"selected":""}>${t}</option>`).join("")}</select>
    <label>Filter</label><select id="cg_n">${[["3","ND8 (3 Stufen)"],["6","ND64 (6 Stufen)"],["10","ND1000 (10 Stufen)"]].map(o=>`<option value="${o[0]}" ${S.get("cg_n","6")===o[0]?"selected":""}>${o[1]}</option>`).join("")}</select>
    <div class="result" id="cg_r"></div></div>`;
  return h;
}
function calcAll(){
  const crop=CROPS[S.get("crop","apsc")].f;
  const f=parseFloat($("#cv_f")?.value);
  if($("#cv_r")){
    if(f>0){const s=+$("#cv_s").value;const t=Math.pow(2,s)/(f*crop);
      $("#cv_r").textContent="≈ "+fmtTime(t);
      $("#cv_n").textContent=`Entspricht ${Math.round(f*crop)} mm an Vollformat. Gilt nur gegen Verwackeln, nicht gegen Bewegung des Motivs.`;
      S.set("cv_f",f);S.set("cv_s",$("#cv_s").value);}
    else {$("#cv_r").textContent="";$("#cv_n").textContent="Bitte eine Brennweite eingeben.";}
  }
  const fs=parseFloat($("#cs_f")?.value);
  if($("#cs_r")){
    if(fs>0){const t=500/(fs*crop);$("#cs_r").textContent="≈ "+Math.floor(t)+" s";
      $("#cs_n").textContent="Für große Ansichten lieber etwas kürzer belichten.";S.set("cs_f",fs);}
    else {$("#cs_r").textContent="";$("#cs_n").textContent="Bitte eine Brennweite eingeben.";}
  }
  if($("#cg_r")){
    const tv=$("#cg_t").value;const base=tv.includes("/")?1/parseFloat(tv.split("/")[1]):parseFloat(tv);
    const t=base*Math.pow(2,+$("#cg_n").value);
    $("#cg_r").textContent="≈ "+(t>=60?(Math.round(t/6)/10).toString().replace(".",",")+" min":fmtTime(t));
    S.set("cg_t",tv);S.set("cg_n",$("#cg_n").value);
  }
}

function viewKamera(){
  return `<h2>Kamera-Funktionen</h2><p class="muted small" style="margin-top:0">Was moderne Systemkameras können und wofür man es braucht.</p><div class="list">${KAMERA.map(k=>
    `<a class="item" href="#kamera/${k.id}" style="text-decoration:none;color:inherit"><span class="ic">${I[k.icon]}</span><span class="grow"><span class="t">${esc(k.title)}</span></span></a>`).join("")}</div>`;
}
function viewKam(id){
  const k=KAMERA.find(x=>x.id===id);if(!k)return"<p>Nicht gefunden.</p>";
  return `<button class="back" onclick="history.back()">${I.back} Zurück</button><div class="card">
  <div class="head"><span class="ic">${I[k.icon]}</span><div><div class="crumb">Kamera</div><div class="title">${esc(k.title)}</div></div></div>
  ${k.text.map(t=>`<p>${esc(t)}</p>`).join("")}${sonyBox(k.sony)}</div>`;
}

function viewGlossar(){
  let h=`<h2>Glossar A–Z</h2><dl class="gl">`;let last="";
  for(const [t,d,type,id] of [...GLOSSAR].sort((a,b)=>a[0].localeCompare(b[0],"de"))){
    const L=t[0].toUpperCase();if(L!==last){h+=`<div class="letter">${L}</div>`;last=L}
    h+=`<dt>${esc(t)}</dt><dd>${esc(d)}${type?` <a class="lk small" href="${href(type,id)}">mehr</a>`:""}</dd>`;
  }
  return h+"</dl>";
}

/* ---------- Suche ---------- */
function searchIndex(){
  const r=[];
  CARDS.filter(c=>!c.soon).forEach(c=>r.push({t:c.title,k:"Motiv",h:"#motive/"+c.id,txt:[c.intro,...(c.tips||[]),...(c.errors||[]),...(c.variants||[]).flatMap(v=>[v.name,...(v.tips||[])])].join(" ")}));
  CARDS.filter(c=>c.soon).forEach(c=>r.push({t:c.title,k:"Motiv (in Arbeit)",h:"",txt:""}));
  GRUND.filter(g=>!g.soon).forEach(g=>r.push({t:g.title,k:"Grundlagen",h:"#grundlagen/"+g.id,txt:g.short+" "+g.text.join(" ")}));
  REGELN.forEach(x=>r.push({t:x.title,k:"Faustregel",h:"#regeln/"+x.id,txt:x.rule+" "+x.text}));
  KAMERA.forEach(x=>r.push({t:x.title,k:"Kamera",h:"#kamera/"+x.id,txt:x.text.join(" ")}));
  GLOSSAR.forEach(([t,d,type,id])=>r.push({t:t,k:"Glossar",h:type?href(type,id):"#glossar",txt:d}));
  return r;
}
function viewSearch(q){
  const n=q.toLowerCase().trim();
  const res=searchIndex().map(x=>{const inT=x.t.toLowerCase().includes(n);const inX=x.txt.toLowerCase().includes(n);return {...x,score:inT?2:(inX?1:0)}}).filter(x=>x.score).sort((a,b)=>b.score-a.score);
  if(!res.length)return `<p class="muted" style="margin-top:20px">Nichts gefunden für „${esc(q)}“.</p>`;
  return `<h2>Suchergebnisse</h2><div class="list">${res.map(x=>x.h?`<a class="item" href="${x.h}" style="text-decoration:none;color:inherit"><span class="grow"><span class="t">${esc(x.t)}</span><br><span class="s">${esc(x.k)}</span></span></a>`:`<div class="item soon"><span class="grow"><span class="t">${esc(x.t)}</span><br><span class="s">${esc(x.k)}</span></span></div>`).join("")}</div>`;
}

/* ---------- Optionen und Anleitung ---------- */
function openSheet(html){
  const o=document.createElement("div");o.className="overlay";o.innerHTML=`<div class="sheet">${html}</div>`;
  o.close=()=>{o.remove();if(!document.querySelector(".overlay"))document.body.classList.remove("noscroll")};
  o.addEventListener("click",e=>{if(e.target===o||e.target.closest("[data-close]"))o.close()});
  document.body.classList.add("noscroll");document.body.appendChild(o);return o;
}
function openOptions(){
  const theme=S.get("theme","auto"),crop=S.get("crop","apsc"),sony=S.get("sony",true);
  const o=openSheet(`<div class="sh"><h2>Optionen</h2><button class="iconbtn" data-close aria-label="Schließen">${I.x}</button></div>
  <div class="opt">
    <div class="row"><span>Design</span><select id="o_theme" style="width:auto">${[["auto","Wie das Handy"],["light","Hell"],["dark","Dunkel"]].map(x=>`<option value="${x[0]}" ${theme===x[0]?"selected":""}>${x[1]}</option>`).join("")}</select></div>
    <div class="row"><span>Sensorgröße</span><select id="o_crop" style="width:auto">${Object.entries(CROPS).map(([k,v])=>`<option value="${k}" ${crop===k?"selected":""}>${v.name}</option>`).join("")}</select></div>
    <div class="row"><span>Hinweise „So geht's bei Sony“</span><input type="checkbox" id="o_sony" ${sony?"checked":""} style="width:22px;height:22px"></div>
    <div class="row"><span>Merkliste und Notizen löschen</span><button class="btn danger" id="o_del">Löschen</button></div>
  </div>
  <p class="small muted" style="margin-top:18px">Blitzschnell · Version ${VERSION}<br>Alle Angaben sind Richtwerte zum Nachschlagen, ohne Gewähr. Deine Merkliste und Notizen bleiben nur auf diesem Gerät.</p>`);
  o.querySelector("#o_theme").onchange=e=>{S.set("theme",e.target.value);applyTheme()};
  o.querySelector("#o_crop").onchange=e=>{S.set("crop",e.target.value);render()};
  o.querySelector("#o_sony").onchange=e=>{S.set("sony",e.target.checked);render()};
  o.querySelector("#o_del").onclick=()=>{
    const b=o.querySelector("#o_del");
    if(b.dataset.sure){Object.keys(localStorage).filter(k=>k.startsWith("bs_fav")||k.startsWith("bs_note_")).forEach(k=>localStorage.removeItem(k));b.textContent="Gelöscht";b.disabled=true;delete b.dataset.sure;render();}
    else{b.dataset.sure="1";b.textContent="Wirklich löschen?";}
  };
}
function openHelp(){
  openSheet(`<div class="sh"><h2>Anleitung</h2><button class="iconbtn" data-close aria-label="Schließen">${I.x}</button></div>
  ${ANLEITUNG.map(([t,d])=>`<h3>${esc(t)}</h3><p style="margin:0">${esc(d)}</p>`).join("")}`);
}

/* ---------- Design ---------- */
function applyTheme(){
  const t=S.get("theme","auto");
  const dark=t==="dark"||(t==="auto"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme=dark?"dark":"light";
}
if(window.matchMedia)matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",applyTheme);

/* ---------- Router ---------- */
function render(){
  const q=$("#q").value;
  const hash=location.hash.slice(1)||"motive";
  const [tab,sub]=hash.split("/");
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  let h;
  if(q.trim())h=viewSearch(q);
  else if(tab==="motive")h=sub?viewCard(sub):viewMotive();
  else if(tab==="grundlagen")h=sub?viewGrund(sub):viewGrundlagen();
  else if(tab==="regeln")h=viewRegeln();
  else if(tab==="kamera")h=sub?viewKam(sub):viewKamera();
  else if(tab==="glossar")h=viewGlossar();
  else h=viewMotive();
  $("#main").innerHTML=h;
  bind(tab,sub);
}
let lastHash="";
function bind(tab,sub){
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{motivFilter=b.dataset.f;render()});
  if(tab==="motive"&&sub){
    const fb=$("#favBtn");
    if(fb)fb.onclick=()=>{let f=S.get("fav",[]);if(f.includes(sub)){f=f.filter(x=>x!==sub);toast("Nicht mehr gemerkt")}else{f.push(sub);toast("Gemerkt")}S.set("fav",f);fb.classList.toggle("on")};
    document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{S.set("var_"+sub,+b.dataset.v);const y=scrollY;render();scrollTo(0,y)});
    const n=$("#note");if(n)n.oninput=()=>S.set("note_"+sub,n.value);
  }
  if(tab==="regeln"){
    ["#cv_f","#cv_s","#cs_f","#cg_t","#cg_n"].forEach(s=>{const e=$(s);if(e)e.oninput=e.onchange=calcAll});
    calcAll();
    if(sub){const el=document.getElementById(sub.startsWith("rechner-")?sub:"regel-"+sub);if(el)setTimeout(()=>el.scrollIntoView({block:"start"}),30)}
  }
  if(location.hash!==lastHash&&!(tab==="regeln"&&sub)){scrollTo(0,0)}
  lastHash=location.hash;
}

/* ---------- Start ---------- */
function init(){
  applyTheme();
  $("#logoTop").innerHTML=LOGO;$("#helpBtn").innerHTML=I.help;$("#helpBtn").onclick=openHelp;$("#optBtn").innerHTML=I.gear;$("#optBtn").onclick=openOptions;
  $("#searchIcon").innerHTML=I.search;
  $("#nav").innerHTML=TABS.map(t=>`<button data-tab="${t.id}">${I[t.icon]}<span>${t.name}</span></button>`).join("");
  document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{$("#q").value="";location.hash=b.dataset.tab;render()});
  $("#q").addEventListener("input",render);
  $("#main").addEventListener("click",e=>{const a=e.target.closest("a[href^='#']");if(a&&$("#q").value){$("#q").value=""}});
  window.addEventListener("hashchange",render);
  render();
  if(!S.get("welcomed",false)){
    const w=document.createElement("div");w.className="welcome";
    w.innerHTML=`<span class="logo">${LOGO}</span><h1>Blitzschnell</h1><p>Kurz nachgeschaut –</p><p>scharf getroffen</p><button class="btn primary">Los geht's</button>`;
    w.querySelector("button").onclick=()=>{S.set("welcomed",true);w.remove()};
    document.body.appendChild(w);
  }
  if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
}
init();
</script>
